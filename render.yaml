services:
  - type: web
    name: dexter
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3100"
      - key: DEXTER_MODEL
        value: groq:llama-3.3-70b-versatile
      - key: DEXTER_FALLBACK_MODELS
        value: cerebras:llama-3.3-70b,nvidia:meta/llama-3.1-70b-instruct,gemini-2.5-flash-preview-05-20,mistral-small-latest,gpt-5-mini
      # Multi-key support: use comma-separated keys for rate limit rotation
      # Example: GROQ_API_KEY=key1,key2,key3
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: FINANCIAL_DATASETS_API_KEY
        sync: false
      - key: EXASEARCH_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_ENDPOINT
        value: https://api.smith.langchain.com
      - key: LANGSMITH_PROJECT
        value: dexter
      - key: LANGSMITH_TRACING
        value: "false"
